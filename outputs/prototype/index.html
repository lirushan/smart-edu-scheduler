<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智教通 — 学生课程报名与排课管理系统 (原型 V1.0)</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --primary: #4A90D9;
  --primary-dark: #357ABD;
  --primary-light: #E8F0FE;
  --success: #52C41A;
  --warning: #FA8C16;
  --danger: #F5222D;
  --purple: #722ED1;
  --bg: #F0F2F5;
  --bg-card: #FFFFFF;
  --text: #262626;
  --text-secondary: #8C8C8C;
  --text-muted: #BFBFBF;
  --border: #E8E8E8;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.1);
  --radius: 8px;
  --sidebar-w: 220px;
  --header-h: 56px;
  --transition: 0.2s ease;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); min-height: 100vh; }
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-dark); }

/* ===== Login Page ===== */
.login-page {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
.login-card {
  width: 420px; background: #fff; border-radius: 12px; padding: 48px 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo .icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), var(--purple)); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; margin-bottom: 12px; }
.login-logo h1 { font-size: 22px; color: #1a1a2e; }
.login-logo p { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }

.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select {
  width: 100%; height: 42px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; transition: var(--transition); outline: none; background: #FAFAFA;
}
.form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); background: #fff; }
.form-group .role-selector { display: flex; gap: 8px; }
.form-group .role-btn {
  flex: 1; height: 38px; border: 1px solid var(--border); border-radius: var(--radius);
  background: #fff; cursor: pointer; font-size: 13px; transition: var(--transition); color: var(--text-secondary);
}
.form-group .role-btn:hover { border-color: var(--primary); color: var(--primary); }
.form-group .role-btn.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 20px; height: 42px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; transition: var(--transition); }
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-xs { height: 26px; padding: 0 10px; font-size: 12px; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #D91B1B; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Layout ===== */
.app-layout { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); background: #001529; color: #fff;
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
  display: flex; flex-direction: column;
}
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
.sidebar-header .s-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--purple)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.sidebar-header h2 { font-size: 16px; white-space: nowrap; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.sidebar-nav .nav-section { padding: 8px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; }
.sidebar-nav .nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px;
  color: rgba(255,255,255,0.65); cursor: pointer; transition: var(--transition);
  font-size: 14px; border-left: 3px solid transparent; margin: 2px 0;
}
.sidebar-nav .nav-item:hover { color: #fff; background: rgba(255,255,255,0.06); }
.sidebar-nav .nav-item.active { color: #fff; background: var(--primary); border-left-color: #fff; }
.sidebar-nav .nav-item .nav-icon { width: 20px; text-align: center; font-size: 16px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; cursor: pointer; }
.sidebar-footer:hover { background: rgba(255,255,255,0.06); }
.sidebar-footer .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; flex-shrink: 0; }
.sidebar-footer .user-info { flex: 1; min-width: 0; }
.sidebar-footer .user-name { font-size: 13px; color: #fff; }
.sidebar-footer .user-role { font-size: 11px; color: rgba(255,255,255,0.45); }

.main-content { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.header {
  height: var(--header-h); background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px;
  position: sticky; top: 0; z-index: 50;
}
.header .breadcrumb { font-size: 14px; color: var(--text-secondary); }
.header .breadcrumb span { color: var(--text); }
.header .header-actions { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.header .badge-dot { position: relative; cursor: pointer; font-size: 18px; color: var(--text-secondary); }
.header .badge-dot .dot { position: absolute; top: 0; right: 0; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; border: 2px solid #fff; }

.page-content { padding: 24px; flex: 1; }

/* ===== Cards & Panels ===== */
.card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 600; }

/* Stats Row */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; display: flex; align-items: center; gap: 16px;
}
.stat-card .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.stat-card .stat-icon.blue { background: var(--primary-light); color: var(--primary); }
.stat-card .stat-icon.green { background: #E6FFFB; color: var(--success); }
.stat-card .stat-icon.orange { background: #FFF7E6; color: var(--warning); }
.stat-card .stat-icon.purple { background: #F9F0FF; color: var(--purple); }
.stat-card .stat-value { font-size: 28px; font-weight: 700; }
.stat-card .stat-label { font-size: 13px; color: var(--text-secondary); }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
table th { background: #FAFAFA; padding: 12px 14px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border); white-space: nowrap; }
table td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
table tbody tr:hover { background: #FAFAFA; }

/* ===== Tags ===== */
.tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.tag-blue { background: var(--primary-light); color: var(--primary); }
.tag-green { background: #E6FFFB; color: var(--success); }
.tag-orange { background: #FFF7E6; color: var(--warning); }
.tag-red { background: #FFF1F0; color: var(--danger); }
.tag-purple { background: #F9F0FF; color: var(--purple); }
.tag-gray { background: #F5F5F5; color: var(--text-secondary); }

/* ===== Search Bar ===== */
.search-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.search-bar input, .search-bar select {
  height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; outline: none; background: #fff;
}
.search-bar input:focus, .search-bar select:focus { border-color: var(--primary); }
.search-bar input { width: 220px; }

/* ===== Schedule Grid ===== */
.schedule-grid { display: grid; grid-template-columns: 50px repeat(7, 1fr); gap: 2px; font-size: 12px; }
.schedule-grid .sg-header { background: #FAFAFA; padding: 8px; text-align: center; font-weight: 600; color: var(--text-secondary); border-radius: 4px; }
.schedule-grid .sg-time { background: #FAFAFA; padding: 8px; text-align: center; color: var(--text-secondary); font-size: 11px; border-radius: 4px; }
.schedule-grid .sg-cell {
  min-height: 64px; background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 4px;
  cursor: pointer; transition: var(--transition);
}
.schedule-grid .sg-cell:hover { box-shadow: var(--shadow); }
.schedule-grid .sg-course {
  background: var(--primary-light); border-radius: 3px; padding: 4px 6px;
  margin-bottom: 2px; border-left: 3px solid var(--primary); font-size: 11px;
  cursor: pointer;
}
.schedule-grid .sg-course.green { background: #E6FFFB; border-color: var(--success); }
.schedule-grid .sg-course.orange { background: #FFF7E6; border-color: var(--warning); }
.schedule-grid .sg-course.purple { background: #F9F0FF; border-color: var(--purple); }

/* ===== Course Cards Grid ===== */
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.course-card {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; cursor: pointer; transition: var(--transition); border: 2px solid transparent;
}
.course-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.course-card .cc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.course-card .cc-title { font-size: 15px; font-weight: 600; flex: 1; }
.course-card .cc-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
.course-card .cc-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); }
.course-card .cc-capacity { font-size: 13px; color: var(--text-secondary); }
.course-card .cc-capacity strong { color: var(--primary); }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
  display: flex; align-items: center; justify-content: center; display: none;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: 12px; box-shadow: var(--shadow-lg);
  width: 600px; max-height: 80vh; overflow-y: auto; animation: modalIn 0.2s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 17px; }
.modal-close { width: 32px; height: 32px; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); border-radius: 6px; }
.modal-close:hover { background: #F5F5F5; }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* ===== Filters ===== */
.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-bar select, .filter-bar input { height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; outline: none; }
.filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary); }

/* ===== Misc ===== */
.pagination { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
.pagination button { min-width: 32px; height: 32px; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pagination button:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.tabs .tab { padding: 10px 20px; cursor: pointer; color: var(--text-secondary); font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); }
.tabs .tab:hover { color: var(--primary); }
.tabs .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

.alert { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; }
.alert-info { background: var(--primary-light); color: var(--primary); border: 1px solid rgba(74,144,217,0.2); }
.alert-warning { background: #FFF7E6; color: var(--warning); border: 1px solid rgba(250,140,22,0.2); }
.alert-success { background: #E6FFFB; color: var(--success); border: 1px solid rgba(82,196,26,0.2); }

.tooltip { position: relative; }
.progress-bar { height: 6px; background: #F0F0F0; border-radius: 3px; overflow: hidden; }
.progress-bar .fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.progress-bar .fill.blue { background: var(--primary); }
.progress-bar .fill.green { background: var(--success); }
.progress-bar .fill.orange { background: var(--warning); }

/* Exam page */
.exam-sidebar { width: 240px; background: #fff; border-right: 1px solid var(--border); padding: 16px; position: fixed; top: var(--header-h); bottom: 0; overflow-y: auto; }
.exam-sidebar .qs-item { padding: 8px 12px; margin: 2px 0; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--text-secondary); }
.exam-sidebar .qs-item:hover { background: #F5F5F5; }
.exam-sidebar .qs-item.done { color: var(--success); }
.exam-sidebar .qs-item.current { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.exam-content { margin-left: 240px; padding: 24px; }
.exam-timer { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background: #FFF1F0; color: var(--danger); border-radius: 20px; font-weight: 600; font-size: 14px; }

@media (max-width: 1200px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main-content { margin-left: 0; }
  .stats-row { grid-template-columns: 1fr; }
  .course-grid { grid-template-columns: 1fr; }
}

.hidden { display: none !important; }
.text-right { text-align: right; }
.text-center { text-align: center; }
.mt-16 { margin-top: 16px; }
.mb-16 { margin-bottom: 16px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-8 { gap: 8px; }
.text-secondary { color: var(--text-secondary); font-size: 13px; }
</style>
</head>

<!-- ==================== LOGIN PAGE ==================== -->

<!-- ==================== MAIN APP ==================== -->
<div id="app-main" class="app-layout hidden">

  <!-- Main -->

    <header class="header">
      <div class="breadcrumb" id="breadcrumb">🏠 工作台</div>
      <div class="header-actions">
        <span class="badge-dot" title="消息通知">🔔<span class="dot"></span></span>
        <span style="font-size:13px;color:var(--text-secondary);" id="header-time"></span>
      </div>
    </header>
    <div class="page-content" id="page-content"></div>
  </main>
</div>

<!-- ==================== MODALS ==================== -->
<div class="modal-overlay" id="modal-course-detail">
  <div class="modal" style="width:680px;">
    <div class="modal-header">
      <h3 id="modal-course-title">课程详情</h3>
      <button class="modal-close" onclick="closeModal('modal-course-detail')">✕</button>
    </div>
    <div class="modal-body" id="modal-course-body"></div>
    <div class="modal-footer">

  </div>
</div>

<div class="modal-overlay" id="modal-confirm">
  <div class="modal" style="width:420px;">
    <div class="modal-header">
      <h3>提示</h3>
      <button class="modal-close" onclick="closeModal('modal-confirm')">✕</button>
    </div>
    <div class="modal-body" id="modal-confirm-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('modal-confirm')">取消</button>
      <button class="btn btn-primary btn-sm" id="btn-confirm-ok">确认</button>
    </div>
  </div>
</div>

// ==================== INIT ====================
function updateClock() {
  const now = new Date();
  document.getElementById('header-time').textContent =
    now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' }) +
    ' ' + now.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}
setInterval(updateClock, 30000);
updateClock();

// ==================== LOGIN ====================
document.querySelectorAll('#role-selector .role-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#role-selector .role-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    STATE.role = this.dataset.role;
  });
});

function doLogin() {
  const uname = document.getElementById('login-username').value;
  const pwd = document.getElementById('login-password').value;

  let user = null;
  if (STATE.role === 'student') user = MOCK.students.find(s => s.username === uname);
  else if (STATE.role === 'teacher') user = MOCK.teachers.find(t => t.username === uname);
  else user = MOCK.admins.find(a => a.username === uname);

  if (!user) {
    alert('账号不存在！\n\n试试这些演示账号：\n学生: 2024001001\n教师: T2020001\n管理员: admin');
    return;
  }

  STATE.user = user;
  STATE.role = user.role;

  // Switch view
  document.getElementById('page-login').classList.add('hidden');
  document.getElementById('app-main').classList.remove('hidden');

  // Setup sidebar
  document.getElementById('sidebar-avatar').textContent = user.avatar;
  document.getElementById('sidebar-name').textContent = user.name;
  document.getElementById('sidebar-role').textContent =
    user.role === 'student' ? '学生' : user.role === 'teacher' ? '教师' : '管理员';

  buildSidebar();
  navigateTo('dashboard');
}

function doLogout() {
  STATE.user = null;
  STATE.currentPage = '';
  document.getElementById('app-main').classList.add('hidden');
  document.getElementById('page-login').classList.remove('hidden');
}

// ==================== SIDEBAR ====================
function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  let items = [];

  if (STATE.role === 'student') {
    items = [
      { section: '主菜单' },
      { id: 'dashboard', icon: '🏠', label: '工作台' },
      { id: 'course-market', icon: '📖', label: '课程广场' },
      { id: 'my-schedule', icon: '📅', label: '我的课表' },
      { id: 'my-enrollments', icon: '📋', label: '我的选课' },
      { section: '学习' },
      { id: 'my-scores', icon: '📊', label: '我的成绩' },
      { id: 'exam-center', icon: '📝', label: '考试中心' },
    ];
  } else if (STATE.role === 'teacher') {
    items = [
      { section: '主菜单' },
      { id: 'dashboard', icon: '🏠', label: '工作台' },
      { id: 'my-schedule', icon: '📅', label: '我的课表' },
      { section: '教学管理' },
      { id: 'score-entry', icon: '📊', label: '成绩录入' },
      { id: 'question-bank', icon: '📚', label: '题库管理' },
      { id: 'course-apply', icon: '📖', label: '课程申报' },
    ];
  } else if (STATE.role === 'admin') {
    items = [
      { section: '主菜单' },
      { id: 'dashboard', icon: '🏠', label: '工作台' },
      { section: '管理' },
      { id: 'user-mgmt', icon: '👥', label: '用户管理' },
      { id: 'course-approval', icon: '✅', label: '课程审核' },
      { id: 'round-config', icon: '⚙️', label: '选课轮次配置' },
      { id: 'sys-monitor', icon: '📡', label: '系统监控' },
    ];
  }

  nav.innerHTML = items.map(item => {
    if (item.section) return `<div class="nav-section">${item.section}</div>`;
    return `<div class="nav-item${STATE.currentPage === item.id ? ' active' : ''}" data-page="${item.id}" onclick="navigateTo('${item.id}')">
      <span class="nav-icon">${item.icon}</span>${item.label}
    </div>`;
  }).join('');
}

// ==================== NAVIGATION ====================
function navigateTo(page) {
  STATE.currentPage = page;

  // Update sidebar active
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  // Update breadcrumb
  const breadMap = {
    'dashboard': '🏠 工作台',
    'course-market': '📖 课程广场',
    'my-schedule': '📅 我的课表',
    'my-enrollments': '📋 我的选课',
    'my-scores': '📊 我的成绩',
    'exam-center': '📝 考试中心',
    'score-entry': '📊 成绩录入',
    'question-bank': '📚 题库管理',
    'course-apply': '📖 课程申报',
    'user-mgmt': '👥 用户管理',
    'course-approval': '✅ 课程审核',
    'round-config': '⚙️ 选课轮次配置',
    'sys-monitor': '📡 系统监控',
  };
  document.getElementById('breadcrumb').innerHTML = breadMap[page] || page;

  // Render page
  const content = document.getElementById('page-content');
  const renderer = pageRenderers[page];
  content.innerHTML = renderer ? renderer() : '<div class="card"><p>页面开发中...</p></div>';

  // Init page scripts
  if (page === 'exam-center') initExamPage();
}

function renderCourseCards(courses) {
  return courses.map(c => {
    const isFull = c.enrolled >= c.capacity;
    const isMine = MOCK.myEnrollments.some(e => e.courseId === c.id);
    return `
    <div class="course-card" onclick="showCourseDetail(${c.id})">
      <div class="cc-header">
        <div class="cc-title">${c.name}</div>
        <div style="display:flex;gap:4px;">${c.tags.slice(0,2).map(t => `<span class="tag tag-blue">${t}</span>`).join('')}</div>
      </div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">${c.code} | ${c.credit}学分 | ${c.hours}学时</div>
      <div class="cc-meta">
        <span>👨‍🏫 ${c.teacher} ⭐${c.rating}</span>
        <span>🕐 ${c.time}</span>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">📍 ${c.location}</div>
      <div class="cc-footer">
        <div class="cc-capacity">
          ${isFull ? '<span style="color:var(--danger);">已满</span>' : `剩余 <strong>${c.capacity - c.enrolled}</strong>/${c.capacity} 名额`}
          ${c.prerequisite ? ` | 先修: <span style="color:var(--warning);">${c.prerequisite}</span>` : ''}

        <span class="tag ${isFull ? 'tag-red' : 'tag-green'}">${c.type}</span>
      </div>
    </div>
    `;
  }).join('');
}

function generateScheduleCells(myCourses) {
  let rows = '';
  const periods = ['1-2节<br><small>08:00-09:40</small>', '3-4节<br><small>10:00-11:40</small>',
    '5-6节<br><small>14:00-15:40</small>', '7-8节<br><small>16:00-17:40</small>', '9-10节<br><small>19:00-20:40</small>'];
  const dayMap = { '周一':1, '周二':2, '周三':3, '周四':4, '周五':5 };
  const colors = ['', 'green', 'orange', 'purple'];

  // Build lookup
  const scheduleMap = {};
  myCourses.forEach((c, idx) => {
    const parts = c.time.split(', ');
    parts.forEach(p => {
      const [day, period] = p.split(' ');
      const dayIdx = dayMap[day];
      const pStart = period.split('-')[0];
      const rowIdx = Math.ceil(parseInt(pStart) / 2) - 1;
      const key = `${rowIdx}-${dayIdx}`;
      if (!scheduleMap[key]) scheduleMap[key] = [];
      scheduleMap[key].push({ course: c, color: colors[idx % colors.length] });
    });
  });

  for (let r = 0; r < 5; r++) {
    rows += `<div class="sg-time">${periods[r]}</div>`;
    for (let d = 1; d <= 7; d++) {
      const key = `${r}-${d}`;
      const slots = scheduleMap[key] || [];
      rows += `<div class="sg-cell">${slots.map(s => `<div class="sg-course ${s.color}" onclick="showCourseDetail(${s.course.id})">${s.course.name.substring(0,8)}</div>`).join('')}</div>`;
    }
    rows += '';
  }
  return rows;
}

// ==================== INTERACTIONS ====================
function filterCourses() {
  const type = document.getElementById('filter-type')?.value || '';
  const category = document.getElementById('filter-category')?.value || '';
  const capacity = document.getElementById('filter-capacity')?.value || '';
  const search = document.getElementById('filter-search')?.value?.toLowerCase() || '';

  let filtered = MOCK.courses;
  if (type) filtered = filtered.filter(c => c.type === type);
  if (category) filtered = filtered.filter(c => c.category === category);
  if (capacity === 'has') filtered = filtered.filter(c => c.enrolled < c.capacity);
  if (capacity === 'full') filtered = filtered.filter(c => c.enrolled >= c.capacity);
  if (search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search) || c.teacher.toLowerCase().includes(search) || c.code.toLowerCase().includes(search));

  document.getElementById('course-grid').innerHTML = renderCourseCards(filtered);
}

function showCourseDetail(courseId) {
  const c = MOCK.courses.find(c => c.id === courseId);
  if (!c) return;
  STATE.currentCourse = c;

  document.getElementById('modal-course-title').textContent = c.name;
  document.getElementById('modal-course-body').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div><strong>课程编码：</strong>${c.code}</div>
      <div><strong>学分/学时：</strong>${c.credit}学分 / ${c.hours}学时</div>
      <div><strong>课程类型：</strong><span class="tag tag-blue">${c.type}</span></div>
      <div><strong>科目分类：</strong>${c.category}</div>
      <div><strong>授课教师：</strong>${c.teacher} ⭐${c.rating}</div>
      <div><strong>开课院系：</strong>${c.department}</div>
      <div><strong>上课时间：</strong>${c.time}</div>
      <div><strong>上课地点：</strong>${c.location}</div>
      <div><strong>课程容量：</strong>${c.enrolled >= c.capacity ? '<span style="color:var(--danger);">已满</span>' : `${c.enrolled}/${c.capacity}`}</div>
      <div><strong>先修课程：</strong>${c.prerequisite || '无'}</div>
    </div>
    <div style="padding:12px;background:#FAFAFA;border-radius:var(--radius);margin-bottom:12px;">
      <strong>课程简介</strong>
      <p style="margin-top:6px;color:var(--text-secondary);line-height:1.6;">${c.desc}</p>
    </div>
    <div><strong>课程标签：</strong>${c.tags.map(t => `<span class="tag tag-blue" style="margin:0 2px;">${t}</span>`).join('') || '无'}</div>
  `;

  const btnEnroll = document.getElementById('btn-enroll');
  const alreadyEnrolled = MOCK.myEnrollments.some(e => e.courseId === c.id);
  if (c.enrolled >= c.capacity) {
    btnEnroll.textContent = '已满';
    btnEnroll.disabled = true;
  } else if (alreadyEnrolled) {
    btnEnroll.textContent = '已选课';
    btnEnroll.disabled = true;
  } else {
    btnEnroll.textContent = '立即选课';
    btnEnroll.disabled = false;
  }

  document.getElementById('modal-course-detail').classList.add('show');
}

function doEnroll() {
  if (!STATE.currentCourse) return;
  const c = STATE.currentCourse;

  if (c.enrolled >= c.capacity) {
    alert('该课程已满，请选择其他课程。');
    return;
  }

  c.enrolled += 1;
  MOCK.myEnrollments.push({
    courseId: c.id,
    round: 2,
    status: '已选中',
    time: new Date().toLocaleString('zh-CN'),
  });

  document.getElementById('modal-course-detail').classList.remove('show');
  alert(`选课成功！\n课程：${c.name}\n时间：${c.time}\n地点：${c.location}\n\n剩余名额：${c.capacity - c.enrolled}/${c.capacity}`);

  if (STATE.currentPage === 'course-market') {
    navigateTo('course-market');
  }
}

function confirmDrop(courseId) {
  const c = MOCK.courses.find(c => c.id === courseId);
  if (!c) return;
  document.getElementById('modal-confirm-body').innerHTML = `<p>确认退选课程 <strong>${c.name}</strong> 吗？</p><p style="color:var(--text-secondary);font-size:13px;margin-top:8px;">退课后名额将释放给其他同学，操作不可撤销。</p>`;
  document.getElementById('btn-confirm-ok').onclick = function() {
    const idx = MOCK.myEnrollments.findIndex(e => e.courseId === courseId);
    if (idx >= 0) MOCK.myEnrollments.splice(idx, 1);
    c.enrolled = Math.max(0, c.enrolled - 1);
    closeModal('modal-confirm');
    navigateTo('my-enrollments');
  };
  document.getElementById('modal-confirm').classList.add('show');
}

function startExam(examId) {
  const e = MOCK.exams.find(x => x.id === examId);
  if (!e) return;

  const content = document.getElementById('page-content');
  const qs = MOCK.questions.slice(0, 5);
  content.innerHTML = `
    <div style="display:flex;min-height:calc(100vh - 140px);">
      <div class="exam-sidebar" style="position:static;width:200px;">
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">答题卡</div>
        ${qs.map((q,i) => `<div class="qs-item current" id="qs-${i}" onclick="jumpQuestion(${i})">${i+1}. ${q.type}</div>`).join('')}
        <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
          <button class="btn btn-danger btn-sm" style="width:100%;" onclick="confirmSubmitExam()">交卷</button>
        </div>
      </div>
      <div class="exam-content" style="flex:1;">
        <div class="flex-between" style="margin-bottom:16px;">
          <h2>${e.name}</h2>
          <div class="exam-timer">⏱ <span id="exam-countdown">${e.duration}:00</span></div>
        </div>
        ${qs.map((q,i) => `
          <div class="card exam-question" id="eq-${i}" style="${i>0?'display:none;':''}">
            <div class="card-header"><span class="card-title">第 ${i+1} 题 — ${q.type}</span><span style="font-size:13px;color:var(--text-secondary);">${q.kp}</span></div>
            <p style="line-height:1.8;margin-bottom:16px;">${q.content}</p>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${q.options.map(o => `<label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'"><input type="${q.type==='多选题'?'checkbox':'radio'}" name="q${i}" value="${o[0]}"> ${o}</label>`).join('')}
            </div>
            <div style="margin-top:12px;display:flex;justify-content:space-between;">
              <button class="btn btn-outline btn-sm" ${i===0?'disabled':''} onclick="jumpQuestion(${i-1})">← 上一题</button>
              <button class="btn btn-primary btn-sm" ${i===qs.length-1?'disabled':''} onclick="jumpQuestion(${i+1})">下一题 →</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  STATE.currentExamQs = qs;

  // Start timer
  let seconds = e.duration * 60;
  STATE.examTimer = setInterval(() => {
    seconds--;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('exam-countdown').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if (seconds <= 0) {
      clearInterval(STATE.examTimer);
      alert('考试时间到，系统已自动交卷！');
      navigateTo('exam-center');
    }
  }, 1000);
}

function jumpQuestion(idx) {
  document.querySelectorAll('.exam-question').forEach((el, i) => el.style.display = i === idx ? '' : 'none');
  document.querySelectorAll('.qs-item').forEach((el, i) => {
    el.classList.toggle('current', i === idx);
  });
}

function confirmSubmitExam() {
  document.getElementById('modal-confirm-body').innerHTML = '<p>确认提交试卷吗？</p><p style="color:var(--text-secondary);font-size:13px;margin-top:8px;">交卷后将无法继续作答。</p>';
  document.getElementById('btn-confirm-ok').onclick = function() {
    clearInterval(STATE.examTimer);
    closeModal('modal-confirm');
    alert('交卷成功！\n客观题已自动批改，请等待成绩发布。');
    navigateTo('exam-center');
  };
  document.getElementById('modal-confirm').classList.add('show');
}
