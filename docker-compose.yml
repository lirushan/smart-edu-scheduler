version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart-edu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-SmartEdu2024!}
      MYSQL_DATABASE: smart_edu
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./smart-edu-backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-SmartEdu2024!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smart-edu-net

  redis:
    image: redis:7-alpine
    container_name: smart-edu-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-SmartEduRedis!} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SmartEduRedis!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smart-edu-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smart-edu-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smart-edu-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-edu-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smart_edu
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-SmartEdu2024!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-SmartEduRedis!}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      JWT_SECRET: ${JWT_SECRET:-YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==}
      TZ: Asia/Shanghai
    ports:
      - "8086:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart-edu-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smart-edu-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - smart-edu-net

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  smart-edu-net:
    driver: bridge
