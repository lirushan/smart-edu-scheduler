server:
  port: 8086

spring:
  application:
    name: smart-edu-backend
  profiles:
    active: dev

  # ===== 虚拟线程（Java 21）=====
  threads:
    virtual:
      enabled: true

  # ===== 数据源 =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/smart_edu?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: SmartEdu2024!
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379
      password: SmartEduRedis!
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ===== RabbitMQ =====
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        prefetch: 10
        concurrency: 5
        max-concurrency: 20
        acknowledge-mode: manual
        default-requeue-rejected: false
      direct:
        acknowledge-mode: manual

  # ===== 文件上传 =====
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # ===== Jackson =====
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ===== 初始化数据源 =====
  sql:
    init:
      mode: never

# ===== MyBatis-Plus =====
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartedu.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== JWT =====
jwt:
  secret: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==
  access-token-expiration: 7200
  refresh-token-expiration: 604800

# ===== Redisson =====
redisson:
  single-server-config:
    address: "redis://localhost:6379"
    password: "SmartEduRedis!"
    database: 0
    connection-pool-size: 16
    connection-minimum-idle-size: 4

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# ===== Knife4j =====
springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

---
# ===== Dev Profile =====
spring:
  config:
    activate:
      on-profile: dev

---
# ===== Docker Profile =====
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:smart_edu}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:SmartEdu2024!}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:SmartEduRedis!}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

redisson:
  single-server-config:
    address: "redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}"
    password: "${REDIS_PASSWORD:SmartEduRedis!}"

---
# ===== Prod Profile =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:smart_edu}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}


